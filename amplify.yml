version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@10.28.1
            - pnpm install --frozen-lockfile
        build:
          commands:
            - (env | grep -E '^(API_BASE_URL|NEXT_PUBLIC_API_BASE_URL)=' || true) >> apps/web/.env.production
            - pnpm --filter @restaurant/shared build
            - pnpm --filter @restaurant/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
